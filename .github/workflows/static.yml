# Optional docs deployment to GitHub Pages.
# Mobile app source is not a static website; this workflow deploys docs only.
name: Deploy docs to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare docs site
        run: |
          mkdir -p _site
          cp README.md _site/index.md
          cp -r docs _site/docs
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>AR BON</title></head><body><h1>AR&apos;BON</h1><p>File Storage App docs.</p><ul><li><a href="./index.md">README</a></li><li><a href="./docs/AUDIT_REPORT.md">Audit Report</a></li></ul></body></html>' > _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
